[project]
name = "linguaflow-backend"
version = "0.1.0"
description = "FastAPI backend for LinguaFlow PDF translation"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.29.0",
    "deep-translator==1.11.4",
    "fastapi==0.111.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "pyjwt[crypto]==2.8.0",
    "pymupdf==1.24.5",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.30",
    "uvicorn[standard]==0.30.0",
]

[dependency-groups]
dev = [
    "httpx==0.27.0",
    "mypy==1.10.0",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "respx==0.21.0",
    "ruff==0.4.4",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pymupdf.*",
    "deep_translator.*",
]
ignore_missing_imports = true

